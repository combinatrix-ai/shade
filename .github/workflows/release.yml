name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shade-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag and credentials
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SHADE_SIGN_IDENTITY: ${{ vars.SHADE_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          [[ "$REF_TYPE" == tag ]] || { echo 'Run this workflow against an annotated release tag'; exit 1; }
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Info.plist)
          [[ "$RELEASE_TAG" == "v$version" ]] || exit 1
          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD KEYCHAIN_PASSWORD APPLE_ID APPLE_TEAM_ID NOTARY_PASSWORD SPARKLE_ED_PRIVATE_KEY SHADE_SIGN_IDENTITY; do
            [[ -n "${!name}" ]] || { echo "Missing configuration: $name"; exit 1; }
          done
          umask 077
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/shade.p12"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/shade-ed-key"
          keychain="$RUNNER_TEMP/shade-release.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/shade.p12" -P "$P12_PASSWORD" -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security default-keychain -d user -s "$keychain"
          xcrun notarytool store-credentials shade-notary --keychain "$keychain" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$NOTARY_PASSWORD"
          rm "$RUNNER_TEMP/shade.p12"
      - name: Build, sign, notarize, and verify
        env:
          SHADE_SIGN_IDENTITY: ${{ vars.SHADE_SIGN_IDENTITY }}
          NOTARY_PROFILE: shade-notary
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: SPARKLE_KEY_FILE="$RUNNER_TEMP/shade-ed-key" ./scripts/release.sh
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/Shade.dmg dist/Shade.zip dist/appcast.xml dist/SHA256SUMS --verify-tag --title "Shade $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/shade.p12" "$RUNNER_TEMP/shade-ed-key"
          if [[ -f "$RUNNER_TEMP/shade-release.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/shade-release.keychain-db"
          fi
